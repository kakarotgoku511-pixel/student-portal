<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Student Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #162447, transparent 40%),
                radial-gradient(circle at bottom right, #24104f, transparent 40%),
                #050816;
            color: white;
            overflow-x: hidden;
        }

        /* Background grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 900px;
            margin: auto;
            padding: 50px 0;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeDown 0.8s ease;
        }

        .header h1 {
            font-size: 38px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header p {
            margin-top: 10px;
            color: #aaa;
        }

        /* Profile card */
        .profile-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 25px;
            padding: 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: fadeUp 0.9s ease;
        }

        .profile-top {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 30px rgba(255,255,255,0.25);
            margin-bottom: 18px;
        }

        .profile-top h2 {
            font-size: 28px;
        }

        .profile-top span {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #ddd;
        }

        /* Information */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 20px;
        }

        .info-box small {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-box strong {
            font-size: 18px;
            word-break: break-word;
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 13px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.15);
        }

        .logout {
            background: rgba(255,70,70,0.15);
            border-color: rgba(255,70,70,0.3);
        }

        .logout:hover {
            background: rgba(255,70,70,0.25);
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .container {
                width: 94%;
                padding: 30px 0;
            }

            .profile-card {
                padding: 25px 18px;
            }

            .header h1 {
                font-size: 28px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .profile-picture {
                width: 125px;
                height: 125px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>My Profile</h1>
            <p>Student Portal Profile</p>
        </div>

        <div class="profile-card">

            <div class="profile-top">

                {% if session["profile_picture"] %}

                    <img
                        src="{{ url_for('static', filename='uploads/' + session['profile_picture']) }}"
                        alt="Profile Picture"
                        class="profile-picture"
                    >

                {% else %}

                    <div
                        class="profile-picture"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:#151a30;
                            margin-left:auto;
                            margin-right:auto;
                            font-size:60px;
                        "
                    >
                        👤
                    </div>

                {% endif %}

                <h2>{{ session["username"] }}</h2>

                <span>
                    {{ session["class_name"] }}
                </span>

            </div>


            <div class="info-grid">

                <div class="info-box">
                    <small>Username</small>
                    <strong>
                        {{ session["username"] }}
                    </strong>
                </div>

                <div class="info-box">
                    <small>Email</small>
                    <strong>
                        {{ session["email"] }}
                    </strong>
                </div>

                <div class="info-box">
                    <small>Class</small>
                    <strong>
                        {{ session["class_name"] }}
                    </strong>
                </div>

                <div class="info-box">
                    <small>Account Status</small>
                    <strong>
                        Active
                    </strong>
                </div>

            </div>


            <div class="buttons">

                <a
                    href="{{ url_for('dashboard') }}"
                    class="btn"
                >
                    ← Dashboard
                </a>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn logout"
                >
                    Logout
                </a>

            </div>

        </div>

    </div>

</body>
</html>
