<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password Center</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top, #102a56, #020617 60%);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(7, 20, 45, 0.92);
            border: 1px solid rgba(0, 174, 255, 0.35);
            box-shadow:
                0 0 30px rgba(0, 174, 255, 0.18),
                inset 0 0 25px rgba(0, 174, 255, 0.03);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            outline: none;
            background: #020617;
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                90deg,
                #0284c7,
                #38bdf8
            );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            text-align: center;
            font-size: 14px;
        }

        .requirements {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b;
        }

        .requirements h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .requirements p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.7;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Change Password</h1>

        <p class="subtitle">
            Password Change Center
        </p>


        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}


        <form method="POST" action="/change-password">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ email }}"
                placeholder="Enter your email"
                required
            >


            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                required
            >


            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >


            <button type="submit">
                Change Password
            </button>

        </form>


        <div class="requirements">

            <h3>Password Requirements</h3>

            <p>
                Your password must contain:
                <br>
                • At least one alphabet letter
                <br>
                • At least one number
                <br>
                • At least one symbol
            </p>

        </div>


        <a href="/login" class="back">
            ← Back to Login
        </a>

    </div>

</body>
</html>
