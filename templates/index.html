<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Portal</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            width: 100%;
            height: 100vh;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #102a56 0%,
                    #061326 45%,
                    #020617 100%
                );

            color: white;
        }


        /* =====================================
           BACKGROUND
        ===================================== */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            z-index: 0;
        }


        .grid {

            position: absolute;

            inset: -50%;

            background-image:

                linear-gradient(
                    rgba(56, 189, 248, 0.08) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(56, 189, 248, 0.08) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            transform:
                perspective(500px)
                rotateX(60deg);

            animation:
                gridMove 12s linear infinite;
        }


        @keyframes gridMove {

            from {
                transform:
                    perspective(500px)
                    rotateX(60deg)
                    translateY(0);
            }

            to {
                transform:
                    perspective(500px)
                    rotateX(60deg)
                    translateY(45px);
            }

        }


        .glow {

            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background:
                rgba(0, 174, 255, 0.12);

            filter: blur(90px);

            animation:
                glowMove 6s ease-in-out infinite alternate;
        }


        .glow.one {

            top: -150px;
            left: -150px;
        }


        .glow.two {

            right: -150px;
            bottom: -150px;

            animation-delay: 2s;
        }


        @keyframes glowMove {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.3);
            }

        }


        /* =====================================
           PARTICLES
        ===================================== */

        .particles {

            position: absolute;

            inset: 0;

            pointer-events: none;
        }


        .particle {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #38bdf8;

            opacity: 0.7;

            animation:
                floatParticle
                linear infinite;
        }


        @keyframes floatParticle {

            from {

                transform:
                    translateY(110vh);

                opacity: 0;

            }

            20% {

                opacity: 0.8;

            }

            80% {

                opacity: 0.8;

            }

            to {

                transform:
                    translateY(-10vh);

                opacity: 0;

            }

        }


        /* =====================================
           MAIN SCREEN
        ===================================== */

        .screen {

            position: relative;

            z-index: 5;

            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;
        }


        /* =====================================
           WELCOME
        ===================================== */

        .welcome {

            position: absolute;

            display: flex;

            flex-direction: column;

            align-items: center;

            animation:
                welcomeAnimation
                5s forwards;
        }


        .welcome-small {

            font-size: 15px;

            letter-spacing: 5px;

            color: #94a3b8;

            margin-bottom: 15px;

            opacity: 0;

            animation:
                smallText
                1s
                0.3s
                forwards;
        }


        .welcome h1 {

            font-size:
                clamp(55px, 12vw, 120px);

            font-weight: 900;

            letter-spacing: 12px;

            color: #ffffff;

            text-shadow:

                0 0 10px
                rgba(56, 189, 248, 0.8),

                0 0 30px
                rgba(56, 189, 248, 0.6),

                0 0 70px
                rgba(56, 189, 248, 0.4);

            opacity: 0;

            transform:
                scale(0.5);

            animation:
                welcomeText
                1.5s
                0.6s
                forwards;
        }


        .line {

            width: 0;

            height: 2px;

            margin-top: 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #38bdf8,
                    transparent
                );

            animation:
                lineGrow
                1.2s
                1.4s
                forwards;
        }


        @keyframes smallText {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        @keyframes welcomeText {

            0% {

                opacity: 0;

                transform:
                    scale(0.5);

                filter: blur(15px);
            }

            60% {

                opacity: 1;

                transform:
                    scale(1.08);

                filter: blur(0);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1);
            }

        }


        @keyframes lineGrow {

            from {

                width: 0;
            }

            to {

                width: 80%;
            }

        }


        @keyframes welcomeAnimation {

            0% {

                opacity: 1;
            }

            65% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                visibility: hidden;
            }

        }


        /* =====================================
           CREATOR SCREEN
        ===================================== */

        .creator {

            position: absolute;

            display: flex;

            flex-direction: column;

            align-items: center;

            opacity: 0;

            animation:
                creatorAppear
                2s
                4.5s
                forwards;
        }


        .creator-label {

            font-size: 17px;

            letter-spacing: 3px;

            color: #94a3b8;

            margin-bottom: 18px;
        }


        .creator-picture {

            width: 130px;
            height: 130px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #38bdf8;

            box-shadow:

                0 0 15px
                rgba(56, 189, 248, 0.8),

                0 0 45px
                rgba(56, 189, 248, 0.35);

            margin-bottom: 22px;

            animation:
                picturePulse
                2s
                ease-in-out
                infinite;
        }


        @keyframes picturePulse {

            0%,
            100% {

                box-shadow:

                    0 0 15px
                    rgba(56, 189, 248, 0.8),

                    0 0 35px
                    rgba(56, 189, 248, 0.25);
            }

            50% {

                box-shadow:

                    0 0 25px
                    rgba(56, 189, 248, 1),

                    0 0 65px
                    rgba(56, 189, 248, 0.5);
            }

        }


        .creator h2 {

            font-size:
                clamp(28px, 6vw, 55px);

            letter-spacing: 3px;

            color: white;

            text-shadow:

                0 0 15px
                rgba(56, 189, 248, 0.8);

            margin-bottom: 12px;
        }


        .creator-line {

            width: 0;

            height: 2px;

            background: #38bdf8;

            animation:
                creatorLine
                1s
                5.5s
                forwards;
        }


        @keyframes creatorAppear {

            0% {

                opacity: 0;

                transform:
                    translateY(50px)
                    scale(0.8);

                filter: blur(12px);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter: blur(0);
            }

        }


        @keyframes creatorLine {

            from {

                width: 0;
            }

            to {

                width: 250px;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .welcome h1 {

                letter-spacing: 6px;
            }


            .creator-picture {

                width: 105px;
                height: 105px;
            }


            .creator-label {

                font-size: 13px;

                letter-spacing: 2px;
            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background">

        <div class="grid"></div>

        <div class="glow one"></div>

        <div class="glow two"></div>

        <div class="particles" id="particles"></div>

    </div>


    <!-- MAIN SCREEN -->

    <main class="screen">


        <!-- WELCOME -->

        <section class="welcome">

            <div class="welcome-small">
                STUDENT PORTAL
            </div>

            <h1>
                WELCOME
            </h1>

            <div class="line"></div>

        </section>


        <!-- CREATOR -->

        <section class="creator">

            <div class="creator-label">
                This app is created by
            </div>


            <img
                src="{{ url_for('static', filename='uploads/my_picture.jpg') }}"
                alt="KidBullChris Tech"
                class="creator-picture"
                onerror="this.style.display='none';"
            >


            <h2>
                KidBullChris Tech
            </h2>


            <div class="creator-line"></div>

        </section>


    </main>


    <script>

        /* =====================================
           CREATE PARTICLES
        ===================================== */

        const particles =
            document.getElementById("particles");


        for (
            let i = 0;
            i < 70;
            i++
        ) {

            const particle =
                document.createElement("div");


            particle.className =
                "particle";


            particle.style.left =
                Math.random() * 100 + "%";


            particle.style.animationDuration =
                (5 + Math.random() * 8) + "s";


            particle.style.animationDelay =
                (Math.random() * 8) + "s";


            particle.style.width =
                (1 + Math.random() * 3) + "px";


            particle.style.height =
                particle.style.width;


            particles.appendChild(
                particle
            );

        }


        /* =====================================
           GO TO LOGIN
        ===================================== */

        setTimeout(
            function () {

                window.location.href =
                    "{{ url_for('login') }}";

            },

            8500
        );

    </script>


</body>

</html>
